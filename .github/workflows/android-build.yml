name: Android Debug Build

on:
  push:
    branches: ['gpt-live']
  pull_request:
    branches: ['gpt-live']
  workflow_dispatch:
    inputs:
      backend:
        description: Compiler (device tests and signing always run in Actions)
        type: choice
        options: [colab, actions]
        default: colab

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  compile:
    name: Compile and run unit tests
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/gpt-live'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BUILD_BACKEND: ${{ (github.event_name == 'pull_request' || inputs.backend == 'actions' || github.repository != 'xbghc/rikkahub-gpt-live') && 'actions' || 'colab' }}

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Spotless compares fork changes with the selected upstream baseline.
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 21
        if: env.BUILD_BACKEND == 'actions'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 24
        if: env.BUILD_BACKEND == 'actions'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up pnpm
        if: env.BUILD_BACKEND == 'actions'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11'
          package_json_file: web-ui/package.json
          run_install: false
          cache: true
          cache_dependency_path: web-ui/pnpm-lock.yaml

      - name: Install web UI dependencies
        if: env.BUILD_BACKEND == 'actions'
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Set up Android SDK and native toolchain
        if: env.BUILD_BACKEND == 'actions'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: >-
            platform-tools
            platforms;android-37.0
            platforms;android-37.2
            build-tools;36.0.0
            build-tools;37.0.0
            ndk;28.2.13676358
            cmake;3.22.1

      - name: Set up Gradle and dependency cache
        if: env.BUILD_BACKEND == 'actions'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install release pipeline dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/colab-python"
          "$RUNNER_TEMP/colab-python/bin/pip" install -r tools/colab/requirements.txt
          echo "$RUNNER_TEMP/colab-python/bin" >> "$GITHUB_PATH"

      - name: Verify release pipeline safeguards
        run: python3 -m unittest discover -s tools/colab -p 'test_*.py' -v

      - name: Compile and test in Colab
        if: env.BUILD_BACKEND == 'colab'
        env:
          COLAB_ADC_JSON: ${{ secrets.COLAB_ADC_JSON }}
          COLAB_PROJECT_ID: ${{ vars.COLAB_PROJECT_ID }}
          COLAB_CACHE_FOLDER_ID: ${{ vars.COLAB_CACHE_FOLDER_ID }}
        run: python3 tools/colab/build.py

      - name: Release this run's Colab runtime
        if: always() && env.BUILD_BACKEND == 'colab'
        env:
          COLAB_ADC_JSON: ${{ secrets.COLAB_ADC_JSON }}
          COLAB_PROJECT_ID: ${{ vars.COLAB_PROJECT_ID }}
          COLAB_CACHE_FOLDER_ID: ${{ vars.COLAB_CACHE_FOLDER_ID }}
        run: python3 tools/colab/build.py --cleanup

      # Neither compiler receives the installed application's signing key.
      - name: Prepare temporary compiler signing key
        if: env.BUILD_BACKEND == 'actions'
        env:
          SIGNING_KEY_MODE: pull-request
        run: bash .github/scripts/prepare-debug-signing-key.sh

      - name: Check Kotlin formatting
        if: env.BUILD_BACKEND == 'actions'
        run: |
          ./gradlew spotlessCheck \
            -Prikkahub.firebase.enabled=false \
            --no-daemon --no-configuration-cache --max-workers=1 \
            '-Dorg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Run unit tests and build Debug APKs
        if: env.BUILD_BACKEND == 'actions'
        run: |
          echo "BUILD_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          ./gradlew :speech:testDebugUnitTest :app:testGithubDebugUnitTest :app:assembleGithubDebug :app:assembleGithubDebugAndroidTest \
            -Prikkahub.firebase.enabled=false \
            --init-script tools/colab/fresh-tests.init.gradle \
            --no-daemon --no-configuration-cache --max-workers=1 \
            '-Dorg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Collect prebuilt APKs and fresh unit test reports
        if: env.BUILD_BACKEND == 'actions'
        run: python3 tools/colab/artifacts.py collect --build-started "$BUILD_STARTED"

      - name: Verify prebuilt bundle
        run: python3 tools/colab/artifacts.py verify

      - name: Upload prebuilt APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rikkahub-prebuilt
          path: build/prebuilt/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload compiler logs and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rikkahub-unit-test-reports
          path: |
            build/colab-state.json
            build/colab-state.log
            build/prebuilt/test-results/
            app/build/test-results/testGithubDebugUnitTest/
            speech/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7

  build:
    name: Sign and test prebuilt APKs
    needs: compile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      apk-version: ${{ steps.apk-metadata.outputs.version }}
      apk-version-code: ${{ steps.apk-metadata.outputs.version-code }}
    env:
      PUBLISHED_DEBUG_SIGNING_CERT_SHA256: 6c2d6dfdac13e1901cbec04feba5f10271747230ce21010f5d4e4608658b9c07
    steps:
      - name: Check out validation scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21 for APK signing
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up APK verification and device tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools build-tools;37.0.0

      - name: Download this run's prebuilt APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: rikkahub-prebuilt
          path: build/prebuilt
          digest-mismatch: error

      - name: Verify source SHA, version, file hashes and unit test reports
        run: python3 tools/colab/artifacts.py verify

      # PRs, including same-repository PRs, never receive the published signing secret.
      - name: Prepare isolated PR signing key
        if: github.event_name == 'pull_request'
        env:
          SIGNING_KEY_MODE: pull-request
        run: bash .github/scripts/prepare-debug-signing-key.sh

      - name: Restore and verify original signing key
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY_MODE: published
          RIKKAHUB_DEBUG_KEYSTORE_BASE64: ${{ secrets.RIKKAHUB_DEBUG_KEYSTORE_BASE64 }}
        run: bash .github/scripts/prepare-debug-signing-key.sh

      - name: Sign prebuilt APKs and verify unchanged code and resources
        run: python3 tools/colab/artifacts.py sign

      - name: Verify Debug APK signing certificates before UI tests
        run: bash .github/scripts/verify-apk-signatures.sh

      - name: Enable hardware acceleration for UI tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify voice entry and setup on Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 .github/scripts/verify-prebuilt-voice-ui.py

      - name: Upload voice UI verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rikkahub-voice-ui-verification
          path: |
            build/voice-ui-screenshots/
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 7

      - name: Verify Debug APK signing certificates
        run: bash .github/scripts/verify-apk-signatures.sh

      - name: Read APK version
        id: apk-metadata
        run: |
          metadata=app/build/outputs/apk/github/debug/output-metadata.json
          echo "version=$(jq -er '.elements[0].versionName' "$metadata")" >> "$GITHUB_OUTPUT"
          echo "version-code=$(jq -er '.elements[0].versionCode' "$metadata")" >> "$GITHUB_OUTPUT"

      - name: Upload arm64 APK
        id: apk-arm64
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rikkahub-debug-arm64-v8a
          path: app/build/outputs/apk/github/debug/app-github-arm64-v8a-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Write download summary
        env:
          BUILD_COMMIT: ${{ github.sha }}
          APK_ARM64_URL: ${{ steps.apk-arm64.outputs.artifact-url }}
        run: |
          {
            echo '## Android Debug APK'
            echo "Commit: $BUILD_COMMIT"
            echo ''
            echo "- [arm64-v8a — Android phones]($APK_ARM64_URL)"
            echo ''
            echo 'Download and extract the ZIP, then install the APK. Artifacts are kept for 7 days.'
            echo 'Package: me.rerere.rikkahub.debug. Firebase is disabled. Configure API keys in the app.'
          } >> "$GITHUB_STEP_SUMMARY"

  prerelease:
    name: Publish GPT Live prerelease
    needs: build
    # Serialize the versionCode check and publication across push and manual builds.
    concurrency:
      group: gpt-live-publication
      cancel-in-progress: false
    if: >-
      github.repository == 'xbghc/rikkahub-gpt-live' &&
      github.ref == 'refs/heads/gpt-live' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out publishing script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified arm64 APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: rikkahub-debug-arm64-v8a
          path: release
          digest-mismatch: error

      - name: Publish prerelease with APK and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          APK_VERSION: ${{ needs.build.outputs.apk-version }}
          APK_VERSION_CODE: ${{ needs.build.outputs.apk-version-code }}
        run: bash .github/scripts/publish-gpt-live-prerelease.sh
