name: Android Debug Build

on:
  push:
    branches: ['codex/vercel-gpt-live-release']
  pull_request:
    branches: ['codex/vercel-gpt-live-release']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Keep updates compatible with the published 3.0.1-gpt-live APK.
      DEBUG_SIGNING_CERT_SHA256: 6c2d6dfdac13e1901cbec04feba5f10271747230ce21010f5d4e4608658b9c07

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Spotless compares changed files with origin/master.
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11'
          package_json_file: web-ui/package.json
          run_install: false
          cache: true
          cache_dependency_path: web-ui/pnpm-lock.yaml

      - name: Install web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Set up Android SDK and native toolchain
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: >-
            platform-tools
            platforms;android-37.0
            platforms;android-37.2
            build-tools;36.0.0
            build-tools;37.0.0
            ndk;28.2.13676358
            cmake;3.22.1

      - name: Set up Gradle and dependency cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # This is only a development key. Never put a release signing key in this cache.
      - name: Restore Debug signing key
        id: debug-keystore-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.android/debug.keystore
          key: rikkahub-debug-keystore-v1-${{ runner.os }}

      - name: Verify existing Debug signing key
        shell: bash
        env:
          DEBUG_KEYSTORE_CACHE_HIT: ${{ steps.debug-keystore-cache.outputs.cache-hit }}
        run: |
          if [ "$DEBUG_KEYSTORE_CACHE_HIT" != 'true' ] || [ ! -f "$HOME/.android/debug.keystore" ]; then
            echo '::error::The existing Debug signing key is unavailable. Refusing to create a replacement that would break installed-app updates.'
            exit 1
          fi
          certificate_sha256="$(keytool -exportcert \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey | sha256sum | awk '{print $1}')"
          if [ "$certificate_sha256" != "$DEBUG_SIGNING_CERT_SHA256" ]; then
            echo "::error::Debug signing certificate mismatch: expected $DEBUG_SIGNING_CERT_SHA256, found $certificate_sha256."
            exit 1
          fi
          # Pin Gradle to this verified key across normal builds and emulator test builds.
          signing_directory="$RUNNER_TEMP/rikkahub-signing"
          mkdir -p "$signing_directory"
          install -m 600 "$HOME/.android/debug.keystore" "$signing_directory/debug.keystore"
          echo "RIKKAHUB_DEBUG_KEYSTORE=$signing_directory/debug.keystore" >> "$GITHUB_ENV"

      - name: Check Kotlin formatting
        run: |
          ./gradlew spotlessCheck \
            -Prikkahub.firebase.enabled=false \
            --no-daemon --no-configuration-cache --max-workers=1 \
            '-Dorg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Run unit tests and build Debug APKs
        run: |
          ./gradlew :speech:testDebugUnitTest :app:testGithubDebugUnitTest :app:assembleGithubDebug :app:assembleGithubDebugAndroidTest \
            -Prikkahub.firebase.enabled=false \
            --no-daemon --no-configuration-cache --max-workers=1 \
            '-Dorg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Verify Debug APK signing certificates before UI tests
        run: bash .github/scripts/verify-apk-signatures.sh

      - name: Enable hardware acceleration for UI tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify voice entry and setup on Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/verify-voice-ui.sh

      - name: Upload voice UI verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rikkahub-voice-ui-verification
          path: |
            build/voice-ui-screenshots/
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 7

      - name: Verify Debug APK signing certificates
        run: bash .github/scripts/verify-apk-signatures.sh

      - name: Upload arm64 APK
        id: apk-arm64
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rikkahub-debug-arm64-v8a
          path: app/build/outputs/apk/github/debug/app-github-arm64-v8a-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rikkahub-unit-test-reports
          path: |
            app/build/reports/tests/testGithubDebugUnitTest/
            app/build/test-results/testGithubDebugUnitTest/
            speech/build/reports/tests/testDebugUnitTest/
            speech/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7

      - name: Write download summary
        env:
          BUILD_COMMIT: ${{ github.sha }}
          APK_ARM64_URL: ${{ steps.apk-arm64.outputs.artifact-url }}
        run: |
          {
            echo '## Android Debug APK'
            echo "Commit: $BUILD_COMMIT"
            echo ''
            echo "- [arm64-v8a — Android phones]($APK_ARM64_URL)"
            echo ''
            echo 'Download and extract the ZIP, then install the APK. Artifacts are kept for 7 days.'
            echo 'Package: me.rerere.rikkahub.debug. Firebase is disabled. Configure API keys in the app.'
          } >> "$GITHUB_STEP_SUMMARY"
