# One-time recovery only. Add this file and the recipient's PUBLIC certificate to
# the archived branch in the same commit that disables its old build triggers.
# Never commit the recipient private key or upload the plaintext Debug keystore.
name: Recover original GPT Live Debug signing key

on:
  push:
    branches: ['codex/vercel-gpt-live-release']
    paths: ['.github/workflows/recover-debug-signing.yml']

permissions:
  contents: read

jobs:
  recover:
    if: >-
      github.repository == 'xbghc/rikkahub-gpt-live' &&
      github.ref == 'refs/heads/codex/vercel-gpt-live-release' &&
      github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PUBLISHED_DEBUG_SIGNING_CERT_SHA256: 6c2d6dfdac13e1901cbec04feba5f10271747230ce21010f5d4e4608658b9c07
    steps:
      - name: Check out recipient public certificate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore original Debug signing key
        id: original-key
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.android/debug.keystore
          key: rikkahub-debug-keystore-v1-${{ runner.os }}

      - name: Verify and encrypt the original Debug signing key
        shell: bash
        env:
          ORIGINAL_KEY_CACHE_HIT: ${{ steps.original-key.outputs.cache-hit }}
        run: |
          set -euo pipefail
          umask 077
          signing_key="$HOME/.android/debug.keystore"
          recipient='.github/signing-migration-recipient.pem'
          if [[ "$ORIGINAL_KEY_CACHE_HIT" != 'true' || ! -f "$signing_key" ]]; then
            echo '::error::The original Debug signing-key cache is unavailable; refusing to generate a replacement.'
            exit 1
          fi
          certificate_sha256="$(keytool -exportcert -keystore "$signing_key" \
            -storepass android -alias androiddebugkey | sha256sum | awk '{print $1}')"
          if [[ "$certificate_sha256" != "$PUBLISHED_DEBUG_SIGNING_CERT_SHA256" ]]; then
            echo '::error::Cached Debug signing key does not match the published APK certificate.'
            exit 1
          fi
          openssl x509 -in "$recipient" -noout -checkend 3600
          openssl cms -encrypt -binary -aes-256-cbc -outform DER \
            -in "$signing_key" -out "$RUNNER_TEMP/debug-keystore.cms" "$recipient"
          test -s "$RUNNER_TEMP/debug-keystore.cms"
          rm -f "$signing_key"
          echo 'The verified original key has been encrypted for the migration recipient.'

      - name: Upload encrypted migration artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gpt-live-debug-signing-migration
          path: ${{ runner.temp }}/debug-keystore.cms
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Remove runner copies of signing material
        if: always()
        shell: bash
        run: rm -f "$HOME/.android/debug.keystore" "$RUNNER_TEMP/debug-keystore.cms"
