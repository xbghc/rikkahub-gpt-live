name: Publish GPT Live APKs

on:
  # Updating the publisher also recovers the most recent successful build.
  push:
    branches: [feat/gpt-live]
    paths: [.github/workflows/publish-apks.yml]
  workflow_dispatch:
    inputs:
      build-run-id:
        description: 'Successful Android Debug Build run ID (blank: latest on feat/gpt-live)'
        required: false
        type: string
  workflow_call:
    inputs:
      build-run-id:
        description: Android Debug Build run whose APKs should be published
        required: true
        type: string
    secrets:
      RELEASE_TOKEN:
        description: 'Optional publishing token with Contents: write and Workflows: write for this repository'
        required: false

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish tested APKs
    if: >-
      github.repository == 'xbghc/rikkahub-gpt-live' &&
      github.ref == 'refs/heads/feat/gpt-live' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: gpt-live-release-${{ github.repository }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Select and validate the tested build
        id: source
        env:
          REQUESTED_RUN: ${{ inputs.build-run-id }}
        shell: bash
        run: |
          set -euo pipefail
          build_run="$REQUESTED_RUN"
          if [[ -z "$build_run" ]]; then
            build_run=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/android-build.yml/runs?branch=feat%2Fgpt-live&status=success&per_page=100" \
              --jq '.workflow_runs | map(select(.event == "push" or .event == "workflow_dispatch")) | first | .id // empty')
          fi
          if [[ ! "$build_run" =~ ^[0-9]+$ ]]; then
            echo '::error::No successful Android Debug Build was found. Supply its numeric run ID.'
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$build_run" > source-run.json
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .repository.full_name == $repo and
            .head_repository.full_name == $repo and
            .path == ".github/workflows/android-build.yml" and
            .head_branch == "feat/gpt-live" and
            (.event == "push" or .event == "workflow_dispatch") and
            (.head_sha | test("^[0-9a-f]{40}$"))
          ' source-run.json > /dev/null

          if [[ "$build_run" == "$GITHUB_RUN_ID" ]]; then
            # A reusable publish job starts before the containing run completes.
            # Failed-job reruns can reuse a successful build from an earlier attempt.
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/runs/$build_run/jobs?filter=all&per_page=100" \
              > source-jobs.json
            jq -e '
              [.[].jobs[] | select(.name == "Test and build APKs")]
              | max_by([.run_attempt // 0, .id])
              | .status == "completed" and .conclusion == "success"
            ' source-jobs.json > /dev/null
          else
            jq -e '.status == "completed" and .conclusion == "success"' source-run.json > /dev/null
          fi

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$build_run/artifacts?per_page=100" > source-artifacts.json
          jq -e '
            [.artifacts[] | select(.name | startswith("rikkahub-debug-"))] as $apks |
            ($apks | map(.name) | sort) == [
              "rikkahub-debug-arm64-v8a", "rikkahub-debug-universal", "rikkahub-debug-x86_64"
            ] and all($apks[]; .expired == false and .size_in_bytes > 0)
          ' source-artifacts.json > /dev/null
          {
            echo "run-id=$build_run"
            echo "sha=$(jq -r .head_sha source-run.json)"
            echo "run-number=$(jq -r .run_number source-run.json)"
            echo "tag=gpt-live-debug-$build_run"
          } >> "$GITHUB_OUTPUT"

      - name: Download the three original APK artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rikkahub-debug-*
          merge-multiple: true
          path: dist
          run-id: ${{ steps.source.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Check APKs and prepare release notes
        env:
          SOURCE_RUN: ${{ steps.source.outputs.run-id }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for abi in arm64-v8a x86_64 universal; do
            apk="dist/app-$abi-debug.apk"
            test -s "$apk"
            unzip -tq "$apk"
          done
          (cd dist && sha256sum app-arm64-v8a-debug.apk app-x86_64-debug.apk app-universal-debug.apk > SHA256SUMS)
          cat > release-notes.md <<EOF
          ## GPT Live 语音对话 · Debug 预发布版

          下载 Assets 中的 APK 后直接安装，无需解压：

          - **app-arm64-v8a-debug.apk**：大多数 Android 手机。
          - **app-x86_64-debug.apk**：x86_64 模拟器或设备。
          - **app-universal-debug.apk**：同时包含以上两种架构。
          - **SHA256SUMS**：三个 APK 的 SHA-256 校验值。

          这些文件直接来自已通过测试的 [GitHub Actions 构建]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN)，发布时没有重新编译或签名。

          源码提交：[$SOURCE_SHA]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$SOURCE_SHA)

          这是使用 Debug 签名的开发版本，包名为 me.rerere.rikkahub.debug。Firebase 已关闭；API Key 请在应用内配置。GPT Live 使用方式见 [说明文档]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$SOURCE_SHA/docs/gpt-live.md)。
          EOF

      - name: Check the existing release and tag before publishing
        id: existing
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            > existing-tag.json 2> tag-lookup-error.log; then
            tag_object_sha=$(jq -r '.object.sha' existing-tag.json)
            tag_sha="$tag_object_sha"
            tag_type=$(jq -r '.object.type' existing-tag.json)
            # Resolve annotated tags as well as lightweight tags without changing either.
            for _ in {1..16}; do
              if [[ "$tag_type" != tag ]]; then
                break
              fi
              gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" > tag-object.json
              tag_sha=$(jq -r '.object.sha' tag-object.json)
              tag_type=$(jq -r '.object.type' tag-object.json)
            done
            if [[ "$tag_type" != commit || "$tag_sha" != "$SOURCE_SHA" ]]; then
              echo '::error::The existing release tag does not resolve to the tested source commit. No assets were changed.'
              exit 1
            fi
          else
            tag_error=$(<tag-lookup-error.log)
            if [[ "$tag_error" != *"HTTP 404"* ]]; then
              printf '%s\n' "$tag_error" >&2
              exit 1
            fi
            # gh release create will create its own tag at the verified source commit.
            tag_object_sha="$SOURCE_SHA"
          fi
          echo "tag-object-sha=$tag_object_sha" >> "$GITHUB_OUTPUT"

          # Query drafts with the default token; the publishing token is used only below.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\")" > existing-release.json
          if [[ -s existing-release.json ]]; then
            jq -e --arg sha "$SOURCE_SHA" '.target_commitish == $sha and .prerelease == true' \
              existing-release.json > /dev/null
          fi

      - name: Publish a version for this build
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_NUMBER: ${{ steps.source.outputs.run-number }}
        shell: bash
        run: |
          set -euo pipefail
          publish_release() {
            local error_file exit_status error_text
            error_file=$(mktemp)
            if gh release "$@" 2> "$error_file"; then
              rm -f "$error_file"
              return 0
            else
              exit_status=$?
              error_text=$(<"$error_file")
              printf '%s\n' "$error_text" >&2
              if [[ "$error_text" == *"HTTP 403"* ]]; then
                echo '::error::GitHub denied Release publication (HTTP 403). Backfilling older builds with workflow changes can require repository secret RELEASE_TOKEN with Contents: write and Workflows: write for xbghc/rikkahub-gpt-live. Verify that the publishing token is authorized for this repository. GITHUB_TOKEN cannot receive Workflows: write.'
              fi
              rm -f "$error_file"
              return "$exit_status"
            fi
          }
          assets=(dist/app-arm64-v8a-debug.apk dist/app-x86_64-debug.apk dist/app-universal-debug.apk dist/SHA256SUMS)
          title="GPT Live Debug · build $SOURCE_NUMBER · ${SOURCE_SHA:0:7}"
          if [[ ! -s existing-release.json ]]; then
            publish_release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
              --title "$title" --notes-file release-notes.md --prerelease --latest=false
          else
            if [[ $(jq -r .draft existing-release.json) == true ]]; then
              publish_release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
              publish_release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --title "$title" --notes-file release-notes.md --draft=false --prerelease --latest=false
            else
              echo 'This build is already published; keeping its existing assets.'
            fi
          fi

      - name: Verify published assets and write download links
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          EXPECTED_TAG_OBJECT: ${{ steps.existing.outputs.tag-object-sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > published-release.json
          jq -e --arg sha "$SOURCE_SHA" '
            .draft == false and .prerelease == true and .target_commitish == $sha and
            ([.assets[].name] | sort) == [
              "SHA256SUMS", "app-arm64-v8a-debug.apk", "app-universal-debug.apk", "app-x86_64-debug.apk"
            ] and all(.assets[]; .state == "uploaded" and .size > 0)
          ' published-release.json > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            --jq '.object.sha' > published-sha.txt
          test "$(cat published-sha.txt)" = "$EXPECTED_TAG_OBJECT"
          while read -r digest apk; do
            if ! jq -e --arg name "$apk" --arg digest "sha256:$digest" \
              'any(.assets[]; .name == $name and .digest == $digest)' \
              published-release.json > /dev/null; then
              echo "::error::The published digest does not match the original artifact: $apk"
              exit 1
            fi
          done < dist/SHA256SUMS
          mkdir published
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir published
          cmp dist/SHA256SUMS published/SHA256SUMS
          {
            echo '## Published GPT Live APKs'
            jq -r '"[Open Release](\(.html_url))", "", (.assets[] | "- [\(.name)](\(.browser_download_url))")' published-release.json
            echo ''
            echo "Source commit: $SOURCE_SHA"
            echo 'Download an APK directly from the Release. These files are not subject to Actions artifact retention.'
          } >> "$GITHUB_STEP_SUMMARY"
