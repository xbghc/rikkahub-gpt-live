name: Withdraw Priority Inference release

on:
  push:
    branches: ['gpt-live']
    paths: ['.github/workflows/withdraw-priority-release.yml']

permissions:
  contents: write

jobs:
  withdraw:
    if: >-
      github.repository == 'xbghc/rikkahub-gpt-live' &&
      contains(github.event.head_commit.message, '[withdraw-priority-release]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Withdraw the published Priority Inference release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_api='repos/xbghc/rikkahub-gpt-live/releases/428072052'
          gh api "$release_api" > current-release.json
          jq -e '
            .id == 428072052 and
            .tag_name == "gpt-live-debug-40901931713" and
            .target_commitish == "4b531ef040f374b8d59799e839d6cf73d1d6ea70" and
            .prerelease == true
          ' current-release.json > /dev/null
          gh api --method PATCH "$release_api" -F draft=true > withdrawn-release.json
          jq -e '.draft == true' withdrawn-release.json > /dev/null
          jq -e -s '
            (.[0].assets | map({id, name, size, digest})) ==
            (.[1].assets | map({id, name, size, digest}))
          ' current-release.json withdrawn-release.json > /dev/null
          echo 'Withdrawn 3.1.1-gpt-live.3 to draft; all release assets and its tag are preserved.' >> "$GITHUB_STEP_SUMMARY"
